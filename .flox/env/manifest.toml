schema-version = "1.16.0"
# Generated by /floxify

[install]
# README requires Python 3.10+; 3.12 is the newest line all deps support.
python.pkg-path = "python312"
uv.pkg-path = "uv"
# Teaser overlay uses ffmpeg's drawtext filter.
ffmpeg.pkg-path = "ffmpeg"
# Bundled overlay font so the teaser renders the same on macOS, Linux and WSL.
dejavu_fonts.pkg-path = "dejavu_fonts"

[vars]
UV_PYTHON_DOWNLOADS = "never"

[hook]
on-activate = '''
  export FUGAZY_FONT_FILE="$FLOX_ENV/share/fonts/truetype/DejaVuSans.ttf"

  venv="$FLOX_ENV_CACHE/venv"
  if [ ! -d "$venv" ]; then
    uv venv --quiet --python "$(command -v python3)" "$venv"
  fi

  stamp="$venv/.requirements.sha"
  want="$(cat "$FLOX_ENV_PROJECT/requirements.txt" "$FLOX_ENV_PROJECT/requirements-dev.txt" | shasum | cut -d' ' -f1)"
  if [ "$(cat "$stamp" 2>/dev/null)" != "$want" ]; then
    echo "Installing Python packages..." >&2
    VIRTUAL_ENV="$venv" uv pip install --quiet \
      -r "$FLOX_ENV_PROJECT/requirements.txt" \
      -r "$FLOX_ENV_PROJECT/requirements-dev.txt" >&2 \
      && echo "$want" > "$stamp"
  fi

  # `flox activate -- cmd` runs no profile script, so put the venv on PATH
  # here for it; interactive shells get the venv from [profile] below.
  export PATH="$venv/bin:$PATH"

  mkdir -p "$FLOX_ENV_PROJECT/credentials" "$FLOX_ENV_PROJECT/output"
  if [ ! -f "$FLOX_ENV_PROJECT/config.yaml" ]; then
    cp "$FLOX_ENV_PROJECT/config.example.yaml" "$FLOX_ENV_PROJECT/config.yaml"
    echo "Created config.yaml from config.example.yaml" >&2
  fi
'''

[profile]
bash = '''
  source "$FLOX_ENV_CACHE/venv/bin/activate"
'''
zsh = '''
  source "$FLOX_ENV_CACHE/venv/bin/activate"
'''
fish = '''
  source "$FLOX_ENV_CACHE/venv/bin/activate.fish"
'''

[services.web]
command = '''
  cd "$FLOX_ENV_PROJECT" && "$FLOX_ENV_CACHE/venv/bin/uvicorn" server:app --host 127.0.0.1 --port 8000
'''

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
