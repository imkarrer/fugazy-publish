name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flox
        uses: flox/install-flox-action@v2

      # The Flox environment supplies Python, ffmpeg and the overlay font, and
      # its hook installs requirements, so the teaser render test runs here too.
      - name: Test
        uses: flox/activate-action@v2
        with:
          command: pytest -ra
